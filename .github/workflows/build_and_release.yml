name: Build, Test and Release DEB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64]  # пока только amd64, ARM добавим позже
        deb_type: [standard, debug, minimal]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Configure CMake for ${{ matrix.arch }} (${{ matrix.deb_type }})
      run: |
        mkdir -p build-${{ matrix.deb_type }}
        cd build-${{ matrix.deb_type }}
        
        if [ "${{ matrix.deb_type }}" = "debug" ]; then
          BUILD_TYPE="Debug"
        elif [ "${{ matrix.deb_type }}" = "minimal" ]; then
          BUILD_TYPE="Release"
        else
          BUILD_TYPE="Release"
        fi
        
        cmake .. -DCMAKE_BUILD_TYPE=$BUILD_TYPE

    - name: Build project for ${{ matrix.deb_type }}
      run: |
        cd build-${{ matrix.deb_type }}
        cmake --build . -- -j$(nproc)

    - name: Run tests for ${{ matrix.deb_type }}
      if: matrix.deb_type != 'minimal'
      run: |
        cd build-${{ matrix.deb_type }}
        ctest --output-on-failure

    - name: Package DEB with CPack for ${{ matrix.deb_type }}
      run: |
        cd build-${{ matrix.deb_type }}
        cpack -G DEB
        for deb in *.deb; do
          mv "$deb" "${deb%.deb}-${{ matrix.deb_type }}.deb"
        done

    - name: Upload DEB artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deb-package-${{ matrix.deb_type }}
        path: build-${{ matrix.deb_type }}/*.deb

    - name: Create Release and upload assets
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: build-*/*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
